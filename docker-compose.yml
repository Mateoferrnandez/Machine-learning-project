version: "3.9"

services:
  mysql:
    image: mysql:5.7
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=password

  zenml:
    image: zenmldocker/zenml-server
    ports:
      - "8080:80"
    environment:
      - ZENML_STORE_URL=mysql+pymysql://root:password@mysql/zenml
      - ZENML_DEFAULT_USERNAME=admin
      - ZENML_DEFAULT_PASSWORD=Zenml123!
    links:
      - mysql
    depends_on:
      - mysql
    restart: on-failure
